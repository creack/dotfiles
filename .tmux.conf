# tmux config — reload with prefix C-r.

# ---------------------------------------------------------------------------
# Shell + terminal
# ---------------------------------------------------------------------------
# Use the first zsh on PATH (resolves brew/linuxbrew/system without if-shell
# spam). Falls back to the current $SHELL if no zsh found.
run-shell 'tmux set-option -g default-shell "$(command -v zsh || echo $SHELL)"'

# Advertise truecolor properly via the RGB capability (modern, replaces `Tc`).
set -g default-terminal "tmux-256color"
set -as terminal-features ",*256col*:RGB"

# OSC52: tmux copy -> system clipboard automatically.
set -g set-clipboard on

# Snappier escape, focus reporting for editors, more scrollback.
set -sg escape-time 10
set -g  focus-events on
set -g  history-limit 100000
set -g  mouse on

# ---------------------------------------------------------------------------
# Window / pane behavior
# ---------------------------------------------------------------------------
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on
setw -g aggressive-resize on

set  -g set-titles on
setw -g monitor-activity on
set  -g visual-activity off  # quiet — the activity flag in the status is enough

# Names: track current process by default, but stop the shell from clobbering
# names the user set manually.
setw -g automatic-rename on
set  -g allow-rename off

set-window-option -g mode-keys   emacs
set-option         -g status-keys emacs

# ---------------------------------------------------------------------------
# Key bindings
# ---------------------------------------------------------------------------
bind C-r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'
bind C-e new-window -n '~/.tmux.conf' \
  "emacsclient -a '' -c -t ~/.tmux.conf && tmux source ~/.tmux.conf && tmux display '~/.tmux.conf sourced'"
bind C-n command-prompt -p 'new-session:' 'new-session -A -s %%'
bind C-s set synchronize-panes
bind C-h new-window 'htop || top'

# Splits and new windows inherit the current pane's cwd.
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

bind =   select-layout main-vertical
bind <   resize-pane -L 10
bind >   resize-pane -R 10
bind -   resize-pane -D 5
bind +   resize-pane -U 5

# Copy-mode: emacs-style select + copy, send selection to system clipboard.
bind -T copy-mode M-w send -X copy-pipe-and-cancel
bind -T copy-mode C-w send -X copy-pipe-and-cancel

# Cycle windows / sessions without the prefix.
bind -n Home    choose-tree -Zw
bind -n S-Right next-window
bind -n S-Left  previous-window
bind -n S-Up    switch-client -p
bind -n S-Down  switch-client -n

# ---------------------------------------------------------------------------
# Theme (gruvbox dark — matches starship + emacs doom-gruvbox)
# ---------------------------------------------------------------------------
# User-options (@name): referenced via #{@name} in format strings.
set -g @bg0    "#282828"
set -g @bg1    "#3c3836"
set -g @bg2    "#504945"
set -g @fg     "#ebdbb2"
set -g @gray   "#a89984"
set -g @yellow "#fabd2f"
set -g @orange "#fe8019"
set -g @blue   "#83a598"
set -g @red    "#fb4934"

# macOS puts the menu bar up top; Linux WMs often put a panel at the bottom.
if-shell '[ "$(uname -s)" = "Darwin" ]' \
  'set -g status-position bottom' \
  'set -g status-position top'

set  -g status-interval     15
set  -g status-left-length  40
set  -g status-right-length 80
set  -g status-justify      left
set  -g status-style        "fg=#{@gray},bg=#{@bg1}"

set  -g status-left  "#[fg=#{@bg0},bg=#{@yellow},bold] #S #[fg=#{@yellow},bg=#{@bg1},nobold] "
set  -g status-right "#[fg=#{@gray}] %Y-%m-%d  %H:%M #[fg=#{@orange},bg=#{@bg1}]#[fg=#{@bg0},bg=#{@orange},bold] #h "

setw -g window-status-format         " #I:#W#F "
setw -g window-status-current-format "#[fg=#{@bg1},bg=#{@orange}]#[fg=#{@bg0},bg=#{@orange},bold] #I:#W#F #[fg=#{@orange},bg=#{@bg1},nobold]"
setw -g window-status-separator      ""
setw -g window-status-activity-style "fg=#{@yellow},bg=#{@bg1}"
setw -g window-status-bell-style     "fg=#{@red},bg=#{@bg1},bold"

set  -g pane-border-style           "fg=#{@bg2}"
set  -g pane-active-border-style    "fg=#{@orange}"
set  -g message-style               "fg=#{@bg0},bg=#{@yellow},bold"
set  -g message-command-style       "fg=#{@bg0},bg=#{@orange},bold"
set  -g mode-style                  "fg=#{@bg0},bg=#{@orange},bold"
set  -g display-panes-colour        "#{@bg2}"
set  -g display-panes-active-colour "#{@orange}"
set  -g clock-mode-colour           "#{@yellow}"
