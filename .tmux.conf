# tmux config.
# Reload with prefix C-r.

# ---------------------------------------------------------------------------
# Shell + truecolor
# ---------------------------------------------------------------------------
if-shell '[ "$(uname -s)" = "Darwin" ]' \
  'set -g default-shell /opt/homebrew/bin/zsh' \
  'set -g default-shell /usr/bin/zsh'

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
set -g base-index 1                       # windows start at 1
setw -g pane-base-index 1                 # panes too
set -g renumber-windows on                # close window -> renumber the rest
set -g history-limit 50000
set -g mouse on
set -g focus-events on
set -sg escape-time 10                    # snappier escape
set -g display-time 2500
set -g status-interval 15
setw -g aggressive-resize on

set-window-option -g mode-keys emacs
set-option -g status-keys emacs

# Window titles.
set -g set-titles on
setw -g automatic-rename off
set -g allow-rename on

# Visual activity.
set -g visual-activity on
setw -g monitor-activity on

# Clock.
setw -g clock-mode-style 12

# ---------------------------------------------------------------------------
# Key bindings
# ---------------------------------------------------------------------------
bind C-r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'
bind C-e new-window -n '~/.tmux.conf' "emacsclient -a '' -c -t ~/.tmux.conf && tmux source ~/.tmux.conf && tmux display '~/.tmux.conf sourced'"
bind C-n command-prompt -p 'new-session:' 'new-session -A -s %%'
bind C-s set synchronize-panes
bind C-h new-window 'htop || top'

# Splits keep current pane's cwd.
bind '"' split-window -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"

# Resize.
bind = select-layout main-vertical
bind < resize-pane -L 25
bind > resize-pane -R 25

# Cycle windows / sessions without prefix.
bind -n Home choose-tree
bind -n S-Right next-window
bind -n S-Left  previous-window
bind -n S-Up    switch-client -p
bind -n S-Down  switch-client -n

# ---------------------------------------------------------------------------
# Status bar — clean, no powerline.
# ---------------------------------------------------------------------------
if-shell '[ "$(uname -s)" = "Darwin" ]' \
  'set -g status-position bottom' \
  'set -g status-position top'

set -g status-style                 'fg=colour250,bg=colour236'
set -g status-left-length 40
set -g status-right-length 80

set -g status-left  '#[fg=colour232,bg=colour33,bold] #S #[fg=colour33,bg=colour236]'
set -g status-right '#[fg=colour244,bg=colour236] %Y-%m-%d  %H:%M #[fg=colour33,bg=colour236]#[fg=colour232,bg=colour33,bold] #h '

setw -g window-status-format         ' #I:#W#F '
setw -g window-status-current-format '#[fg=colour236,bg=colour33]#[fg=colour232,bg=colour33,bold] #I:#W#F #[fg=colour33,bg=colour236]'
setw -g window-status-separator      ''
setw -g window-status-activity-style 'fg=colour226,bg=colour236'

set -g pane-border-style        'fg=colour238'
set -g pane-active-border-style 'fg=colour33'
set -g message-style            'fg=colour232,bg=colour33,bold'
set -g mode-style               'fg=colour232,bg=colour33,bold'
