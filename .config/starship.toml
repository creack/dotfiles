# Starship prompt config.
# Docs: https://starship.rs/config/

format = """
[\\[](bold yellow)$hostname[\\]](bold yellow)\
$directory\
$git_branch$git_status$git_state\
$cmd_duration\
$line_break\
$character"""

right_format = """$golang$nodejs$python$rust"""

add_newline = false
command_timeout = 1000

[hostname]
ssh_only = false
format = "[$hostname]($style)"
style = "bold yellow"
disabled = false

[directory]
truncation_length = 4
truncate_to_repo = true
style = "bold cyan"
format = " [$path]($style)[$read_only]($read_only_style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold purple"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold red"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "yellow"

[golang]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold cyan"

[nodejs]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold green"
detect_files = ["package.json", ".nvmrc"]

[python]
symbol = " "
format = '[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style) '
style = "bold yellow"

[rust]
symbol = " "
format = "[$symbol($version)]($style) "
style = "bold red"

[aws]
disabled = true

[gcloud]
disabled = true
